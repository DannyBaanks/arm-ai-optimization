name: Arm64 benchmark evidence

on:
  workflow_dispatch: {}
  push:
    branches: ["**"]

jobs:
  benchmark:
    # GitHub-hosted Arm64 runner (Azure Cobalt silicon), free for public
    # repos. No cloud account, no SSH, no credit card -- this job is the
    # "real Arm64 host" the harness's own README asks for.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Confirm we are actually on Arm64
        run: |
          uname -m
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "::error::runner is not aarch64, refusing to produce evidence"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the harness
        run: python -m pip install -e . pytest

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and wait for it to be ready
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null; then
              echo "ollama is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::ollama never became ready"
          exit 1

      - name: Pull a small model
        run: ollama pull qwen2.5:0.5b

      - name: Run the naive comparison (default Ollama threading)
        # Ollama defaults to using ~all cores for every request. With
        # --workers 4 on a 4-vCPU runner, 4 concurrent requests each try to
        # use 4 threads: 16 threads fighting over 4 cores. This step exists
        # to document that oversubscription honestly, not to hide it.
        run: |
          mkdir -p evidence
          python -m armopt.cli \
            --adapter http --http-url http://localhost:11434 --http-model qwen2.5:0.5b \
            --workload-file workloads/demo.json \
            --workers 4 --repeats 3 --mode both \
            --evidence evidence/arm64_naive.json \
            --workload-id demo-arm64-ci-naive \
            | tee evidence/arm64_naive_stdout.json

      - name: Run the thread-capped comparison (fair core split)
        # num_thread=1 for every request, on both baseline and dataflow, so
        # 4 concurrent requests divide the 4 cores instead of fighting for
        # them. Both modes get the identical per-request thread budget --
        # this is an apples-to-apples control, not a thumb on the scale.
        run: |
          python -m armopt.cli \
            --adapter http --http-url http://localhost:11434 --http-model qwen2.5:0.5b \
            --http-num-thread 1 \
            --workload-file workloads/demo.json \
            --workers 4 --repeats 3 --mode both \
            --evidence evidence/arm64_capped.json \
            --workload-id demo-arm64-ci-thread-capped \
            | tee evidence/arm64_capped_stdout.json

      - name: Publish results to the job summary
        run: |
          echo "## Arm64 benchmark evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner architecture: \`$(uname -m)\`, \`$(nproc)\` vCPUs" >> "$GITHUB_STEP_SUMMARY"
          echo "### Naive (default Ollama threading, cores oversubscribed)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat evidence/arm64_naive_stdout.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Thread-capped (num_thread=1, cores divided fairly)" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat evidence/arm64_capped_stdout.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: arm64-evidence
          path: |
            evidence/arm64_naive.json
            evidence/arm64_capped.json
