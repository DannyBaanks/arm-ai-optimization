[package]
name = "armopt-native"
version = "0.1.0"
edition = "2021"
description = "Native Rust engine for Arm AI Optimization Harness - same contract as Python reference"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

# WASM-compatible async (always available)
futures = { version = "0.3", optional = true }
futures-timer = { version = "3.0", optional = true }

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros"] }

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
default = ["native"]
native = []
wasm = ["futures", "futures-timer"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1