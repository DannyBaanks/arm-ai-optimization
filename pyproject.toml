[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-ai-optimization-harness"
version = "0.1.0"
description = "Portable benchmark harness for Arm AI inference optimization"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
armopt = "armopt.cli:main"
armopt-select = "armopt.select:main"
armopt-menu = "armopt.menu:main"

[tool.setuptools.packages.find]
where = ["src"]
